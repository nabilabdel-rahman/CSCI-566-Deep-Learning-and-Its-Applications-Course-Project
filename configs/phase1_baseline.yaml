# Phase 1 baseline: plain ERM on Camelyon17-WILDS, matching the official WILDS
# DenseNet-121 setup so results are comparable to the leaderboard (~70% OOD test acc).
experiment_name: phase1_erm_densenet121
seed: 0
output_dir: outputs

data:
  root_dir: data
  download: true
  frac: 1.0          # fraction of every split to use; set to e.g. 0.02 for quick debugging
  num_workers: 4

model:
  arch: densenet121  # densenet121 | resnet18 | resnet50
  pretrained: false  # official WILDS baseline trains from scratch

train:
  algorithm: erm
  augment: []        # any of: flip, stain
  stain_sigma: 0.1   # stain color jitter strength (used when "stain" is in augment)
  stain_p: 0.5       # probability of jittering each training image
  stain_intensity_scale: 1.0  # 1.0 = physical optical density (weak); 255.0 = Gao et al. reference code (~4x stronger)
  epochs: 5
  batch_size: 32
  optimizer: sgd
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.01
  amp: true          # mixed precision; only takes effect on CUDA GPUs

eval:
  batch_size: 256
  select_on: val     # split used to pick the best checkpoint; "val" is the OOD hospital (1)
